name: Build TeX Live image

# Builds the trimmed TeX Live image used by build.yml (see docker/Dockerfile).
# Runs when the image definition changes, monthly to pick up TeX Live tlnet
# updates, or on demand.
on:
  push:
    branches: [ main, master ]
    paths:
      - 'docker/**'
      - '.github/workflows/docker-image.yml'
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cv-texlive

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: docker
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record digest
        run: echo "Pushed $IMAGE@sha256:${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
