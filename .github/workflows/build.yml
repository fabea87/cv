name: Build LaTeX CV

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache external fonts
        id: font-cache
        uses: actions/cache@v4
        with:
          path: .fonts
          key: cv-external-fonts-v4

      - name: Install 汇文正楷 (Huiwen ZhengKai) heading font
        env:
          HUIWEN_FONT_B64: ${{ secrets.HUIWEN_FONT_B64 }}
        run: |
          # CV-cn.tex uses 汇文正楷 as its ONLY CJK heading face and has no fallback,
          # so the build cannot succeed without it. The TTF is personal-use licensed
          # and therefore NOT in the repository; it is stored base64-encoded in the
          # HUIWEN_FONT_B64 repository secret.
          if [ -z "$HUIWEN_FONT_B64" ]; then
            echo "::error::Secret HUIWEN_FONT_B64 is not set. Create it from the local font:"
            echo "::error::  base64 -i fonts/HuiwenZhengKai.ttf | pbcopy  (then paste into the repo secret)"
            exit 1
          fi
          mkdir -p fonts
          printf '%s' "$HUIWEN_FONT_B64" | base64 --decode > fonts/HuiwenZhengKai.ttf

          # Fail fast on a truncated / corrupted / text-wrapped secret.
          if [ ! -s fonts/HuiwenZhengKai.ttf ]; then
            echo "::error::Decoded fonts/HuiwenZhengKai.ttf is empty -- the secret is not valid base64."
            exit 1
          fi
          sig=$(head -c 4 fonts/HuiwenZhengKai.ttf | od -An -tx1 | tr -d ' \n')
          case "$sig" in
            00010000|74727565|4f54544f) ;;   # TrueType, 'true', 'OTTO'
            *) echo "::error::fonts/HuiwenZhengKai.ttf is not a TrueType/OpenType font (signature: $sig)."; exit 1 ;;
          esac
          ls -l fonts/HuiwenZhengKai.ttf

      - name: Download Noto Serif CJK SC (static faces)
        if: steps.font-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .fonts

          # Static Simplified Chinese OTFs. CV-cn.tex needs the CJK family (real
          # Bold face); the variable "Noto Serif SC" has no bold instance.
          for weight in Regular Bold; do
            curl -fsSL "https://github.com/notofonts/noto-cjk/raw/main/Serif/OTF/SimplifiedChinese/NotoSerifCJKsc-${weight}.otf" \
              -o ".fonts/NotoSerifCJKsc-${weight}.otf"
          done

      - name: Compile LaTeX documents (XeLaTeX)
        uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            CV.tex
            CV-cn.tex
          latexmk_use_xelatex: true
          extra_fonts: |
            fonts/*.ttf
            .fonts/*.ttf
            .fonts/*.otf

      - name: Verify Chinese CV uses Huiwen ZhengKai
        run: |
          # A missing or mis-named CJK heading face would otherwise only show up as
          # a wrong-looking PDF, so assert on the fonts actually embedded in it.
          command -v pdffonts >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils; }
          pdffonts CV-cn.pdf
          pdffonts CV-cn.pdf | grep -qi 'HuiwenZhengkai' \
            || { echo "::error::CV-cn.pdf does not embed Huiwen ZhengKai -- CJK headings are wrong."; exit 1; }
          pdffonts CV-cn.pdf | grep -qi 'NotoSerifCJKsc' \
            || { echo "::error::CV-cn.pdf does not embed Noto Serif CJK SC -- CJK body text is wrong."; exit 1; }
          # No trace of the removed fallback face.
          if pdffonts CV-cn.pdf | grep -qi 'FZYTK'; then
            echo "::error::CV-cn.pdf still embeds the retired FZYTK fallback face."; exit 1
          fi

      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdfs
          path: |
            CV.pdf
            CV-cn.pdf

      - name: Prepare GitHub Pages files
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          mkdir -p _site
          cp CV.pdf CV-cn.pdf _site/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish Latest Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest CV PDFs"
          body: "Automated build of Curriculum Vitae (XeLaTeX) generated on push to `main`."
          prerelease: false
          files: |
            CV.pdf
            CV-cn.pdf

      - name: Release Tagged PDFs
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            CV.pdf
            CV-cn.pdf

  deploy-pages:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: "pages"
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
