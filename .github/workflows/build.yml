name: Build LaTeX CV

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache external fonts
        id: font-cache
        uses: actions/cache@v4
        with:
          path: .fonts
          key: cv-external-fonts-v4

      - name: Install 汇文正楷 (Huiwen ZhengKai) heading font
        env:
          HUIWEN_FONT_KEY: ${{ secrets.HUIWEN_FONT_KEY }}
        run: |
          set -euo pipefail
          # CV-cn.tex uses 汇文正楷 as its ONLY CJK heading face and has no fallback,
          # so the build cannot succeed without it. The TTF is personal-use licensed
          # and therefore not committed in the clear: assets/HuiwenZhengKai.ttf.gz.enc
          # is the gzip'd font encrypted with AES-256-CBC (PBKDF2-HMAC-SHA256), and the
          # passphrase lives in the HUIWEN_FONT_KEY repository secret.
          # A 48 KB secret limit rules out storing the font itself as base64.
          if [ -z "${HUIWEN_FONT_KEY:-}" ]; then
            echo "::error::Secret HUIWEN_FONT_KEY is not set; cannot decrypt the CJK heading font."
            exit 1
          fi

          mkdir -p fonts
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 \
            -pass env:HUIWEN_FONT_KEY \
            -in assets/HuiwenZhengKai.ttf.gz.enc -out "$RUNNER_TEMP/huiwen.ttf.gz"
          gunzip -c "$RUNNER_TEMP/huiwen.ttf.gz" > fonts/HuiwenZhengKai.ttf

          # Verify the decrypted bytes against the committed checksum, so a wrong
          # passphrase or a corrupted blob fails here with a clear message.
          expected=$(cat assets/HuiwenZhengKai.ttf.sha256)
          actual=$(sha256sum fonts/HuiwenZhengKai.ttf | awk '{print $1}')
          if [ "$expected" != "$actual" ]; then
            echo "::error::Decrypted HuiwenZhengKai.ttf checksum mismatch (wrong HUIWEN_FONT_KEY or corrupt blob)."
            exit 1
          fi
          ls -l fonts/HuiwenZhengKai.ttf

      - name: Download Noto Serif CJK SC (static faces)
        if: steps.font-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .fonts

          # Static Simplified Chinese OTFs. CV-cn.tex needs the CJK family (real
          # Bold face); the variable "Noto Serif SC" has no bold instance.
          for weight in Regular Bold; do
            curl -fsSL "https://github.com/notofonts/noto-cjk/raw/main/Serif/OTF/SimplifiedChinese/NotoSerifCJKsc-${weight}.otf" \
              -o ".fonts/NotoSerifCJKsc-${weight}.otf"
          done

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile LaTeX documents (XeLaTeX)
        uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            CV.tex
            CV-cn.tex
          latexmk_use_xelatex: true
          # Trimmed TeX Live image (scheme-basic + this CV's package closure,
          # ~400 MB) built from docker/Dockerfile by docker-image.yml, instead
          # of the ~4 GB full texlive-alpine scheme. Digest-pinned for
          # reproducible builds; refresh by re-pinning after a docker-image.yml
          # run (or replace the digest with :latest to always track it).
          docker_image: ghcr.io/fabea87/cv-texlive@sha256:df6a6ce58942b8e29fdfe9960684ef4a3a75276c8fc66cc46a6fea92ad44dbc6
          extra_fonts: |
            fonts/*.ttf
            .fonts/*.ttf
            .fonts/*.otf
          # Font verification runs inside the container via pdffonts (baked into
          # the image), because recent ubuntu-latest images no longer preinstall
          # poppler-utils and the per-run apt install cost ~70s. Output is
          # written to a file first: the container entrypoint sets pipefail, and
          # `pdffonts | grep -q` would otherwise misreport a SIGPIPE (141) as a
          # failed match.
          post_compile: |
            pdffonts CV-cn.pdf > /tmp/cv-cn-fonts.txt
            cat /tmp/cv-cn-fonts.txt
            grep -qi 'HuiwenZhengkai' /tmp/cv-cn-fonts.txt \
              || { echo "::error::CV-cn.pdf does not embed Huiwen ZhengKai -- CJK headings are wrong."; exit 1; }
            grep -qi 'NotoSerifCJKsc' /tmp/cv-cn-fonts.txt \
              || { echo "::error::CV-cn.pdf does not embed Noto Serif CJK SC -- CJK body text is wrong."; exit 1; }
            # No trace of the removed fallback face.
            if grep -qi 'FZYTK' /tmp/cv-cn-fonts.txt; then
              echo "::error::CV-cn.pdf still embeds the retired FZYTK fallback face."; exit 1
            fi


      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdfs
          path: |
            CV.pdf
            CV-cn.pdf

      - name: Prepare GitHub Pages files
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          mkdir -p _site
          cp CV.pdf CV-cn.pdf _site/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish Latest Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest CV PDFs"
          body: "Automated build of Curriculum Vitae (XeLaTeX) generated on push to `main`."
          prerelease: false
          files: |
            CV.pdf
            CV-cn.pdf

      - name: Release Tagged PDFs
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            CV.pdf
            CV-cn.pdf

  deploy-pages:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: "pages"
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
