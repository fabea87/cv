name: Build LaTeX CV

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache external fonts
        id: font-cache
        uses: actions/cache@v4
        with:
          path: .fonts
          key: cv-external-fonts-v2

      - name: Download Noto Serif SC
        if: steps.font-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .fonts

          # Download Noto Serif SC (OTF)
          curl -fsSL "https://github.com/notofonts/noto-cjk/releases/download/Serif2.003/14_NotoSerifSC.zip" \
            -o notoserifsc.zip
          unzip -q -j notoserifsc.zip "SubsetOTF/SC/NotoSerifSC-*.otf" -d .fonts/
          rm -f notoserifsc.zip

      - name: Compile LaTeX documents (XeLaTeX)
        uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            CV.tex
            CV-cn.tex
          latexmk_use_xelatex: true
          extra_fonts: |
            fonts/*.ttf
            .fonts/*.ttf
            .fonts/*.otf

      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdfs
          path: |
            CV.pdf
            CV-cn.pdf

      - name: Prepare GitHub Pages files
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          mkdir -p _site
          cp CV.pdf CV-cn.pdf _site/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish Latest Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest CV PDFs"
          body: "Automated build of Curriculum Vitae (XeLaTeX) generated on push to `main`."
          prerelease: false
          files: |
            CV.pdf
            CV-cn.pdf

      - name: Release Tagged PDFs
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            CV.pdf
            CV-cn.pdf

  deploy-pages:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: "pages"
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
